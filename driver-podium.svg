<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%">
  <defs>
    <!-- Halftone -->
    <pattern id="halftone" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="3" cy="3" r="2.2" fill="#000000" opacity="0.15" />
    </pattern>
    <pattern id="halftone-cyan" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <circle cx="4" cy="4" r="3" fill="#00FFFF" opacity="0.1" />
    </pattern>
    
    <!-- Paper Texture Filter -->
    <filter id="paper-texture" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feColorMatrix type="matrix" values="1 0 0 0 0  0 0.9 0 0 0  0 0.7 0 0 0  0 0 0 0.2 0" in="noise" result="coloredNoise" />
      <feBlend in="SourceGraphic" in2="coloredNoise" mode="multiply" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="red-suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3333" />
      <stop offset="70%" stop-color="#CC0000" />
      <stop offset="100%" stop-color="#660000" />
    </linearGradient>
    <linearGradient id="blue-suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E90FF" />
      <stop offset="70%" stop-color="#00008B" />
      <stop offset="100%" stop-color="#000033" />
    </linearGradient>

    <style>
      .title-small { font-family: 'Arial Black', Impact, sans-serif; font-size: 14px; fill: #111; letter-spacing: 2px; }
      .title-large { font-family: 'Arial Black', Impact, sans-serif; font-size: 36px; font-weight: 900; letter-spacing: -1px; text-transform: uppercase; }
      .title-front { fill: #E23636; stroke: #000; stroke-width: 2; }
      .title-3d { fill: #FFEB3B; stroke: #000; stroke-width: 2; }
      .title-shadow { fill: #000; }
      
      .publisher { font-family: 'Arial Black', sans-serif; font-size: 11px; fill: #FFF; font-weight: 900; text-align: center; }
      .price { font-family: 'Arial', sans-serif; font-size: 9px; font-weight: bold; fill: #111; }
      .burst { font-family: 'Impact', sans-serif; font-size: 15px; font-style: italic; fill: #E23636; stroke: #FFF; stroke-width: 0.5; }
      
      .tingle { animation: pulse 0.5s ease-in-out infinite alternate; }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.8; }
        100% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 10px #FFEB3B); }
      }
      .breathe { animation: float 4s ease-in-out infinite; transform-origin: center; }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
    </style>
  </defs>

  <!-- Base with Paper Texture -->
  <g filter="url(#paper-texture)">
    <rect x="0" y="0" width="300" height="400" fill="#F4E8C1" />
    
    <!-- Main Comic Frame -->
    <rect x="10" y="10" width="280" height="380" fill="#FFC107" stroke="#111" stroke-width="4" />
    <rect x="10" y="10" width="280" height="380" fill="url(#halftone)" />
    <rect x="10" y="10" width="280" height="380" fill="url(#halftone-cyan)" />

    <!-- Comic Clouds -->
    <g fill="#FFF" stroke="#111" stroke-width="3" stroke-linejoin="round" opacity="0.85">
      <path d="M 220 70 A 15 15 0 0 1 230 45 A 20 20 0 0 1 265 45 A 15 15 0 0 1 280 70 Z" />
      <path d="M 30 130 A 20 20 0 0 1 45 100 A 30 30 0 0 1 95 100 A 20 20 0 0 1 110 130 Z" />
    </g>

    <!-- Deep Multi-Layered City Skyline -->
    <!-- Back layer (Blue) -->
    <path d="M 10 400 L 10 210 L 40 210 L 40 160 L 80 160 L 80 230 L 130 230 L 130 180 L 180 180 L 180 250 L 220 250 L 220 140 L 270 140 L 270 210 L 290 210 L 290 400 Z" fill="#000033" opacity="0.6" stroke="#111" stroke-width="2" />
    <!-- Mid layer (Dark Red) -->
    <path d="M 10 400 L 10 270 L 60 270 L 60 210 L 110 210 L 110 280 L 160 280 L 160 230 L 210 230 L 210 290 L 260 290 L 260 230 L 290 230 L 290 400 Z" fill="#4A0000" opacity="0.8" stroke="#111" stroke-width="3" />
    <!-- Front layer (Black) -->
    <path d="M 10 400 L 10 320 L 50 320 L 50 280 L 90 280 L 90 350 L 140 350 L 140 300 L 190 300 L 190 340 L 250 340 L 250 290 L 290 290 L 290 400 Z" fill="#111" stroke="#000" stroke-width="2" />
    <!-- Glowing Windows -->
    <g fill="#FFEB3B" opacity="0.7">
      <rect x="20" y="340" width="5" height="10" /> <rect x="35" y="340" width="5" height="10" />
      <rect x="60" y="300" width="5" height="10" /> <rect x="75" y="300" width="5" height="10" />
      <rect x="100" y="360" width="5" height="10" /> <rect x="115" y="360" width="5" height="10" />
      <rect x="150" y="320" width="5" height="10" /> <rect x="165" y="320" width="5" height="10" />
      <rect x="200" y="360" width="5" height="10" /> <rect x="220" y="360" width="5" height="10" />
      <rect x="260" y="310" width="5" height="10" /> <rect x="275" y="310" width="5" height="10" />
      <!-- Windows on mid layer -->
      <rect x="30" y="290" width="4" height="8" fill="#FF9800" />
      <rect x="80" y="240" width="4" height="8" fill="#FF9800" />
      <rect x="180" y="260" width="4" height="8" fill="#FF9800" />
      <rect x="230" y="250" width="4" height="8" fill="#FF9800" />
    </g>
    
    <!-- Spider-Sense Tingling Lines (Animated) -->
    <g transform="translate(150, 260)">
      <g class="tingle">
        <!-- Yellow offset -->
        <g fill="none" stroke="#FFEB3B" stroke-width="12" stroke-linecap="round">
          <path d="M -60 -90 Q -80 -110 -50 -130" />
          <path d="M -70 -110 Q -90 -130 -60 -150" />
          <path d="M -80 -130 Q -100 -150 -70 -170" />
          <path d="M 60 -90 Q 80 -110 50 -130" />
          <path d="M 70 -110 Q 90 -130 60 -150" />
          <path d="M 80 -130 Q 100 -150 70 -170" />
          <path d="M -75 -40 Q -105 -50 -85 -70" />
          <path d="M -85 -60 Q -115 -70 -95 -90" />
          <path d="M 75 -40 Q 105 -50 85 -70" />
          <path d="M 85 -60 Q 115 -70 95 -90" />
        </g>
        <!-- Red core -->
        <g fill="none" stroke="#E23636" stroke-width="6" stroke-linecap="round">
          <path d="M -60 -90 Q -80 -110 -50 -130" />
          <path d="M -70 -110 Q -90 -130 -60 -150" />
          <path d="M -80 -130 Q -100 -150 -70 -170" />
          <path d="M 60 -90 Q 80 -110 50 -130" />
          <path d="M 70 -110 Q 90 -130 60 -150" />
          <path d="M 80 -130 Q 100 -150 70 -170" />
          <path d="M -75 -40 Q -105 -50 -85 -70" />
          <path d="M -85 -60 Q -115 -70 -95 -90" />
          <path d="M 75 -40 Q 105 -50 85 -70" />
          <path d="M 85 -60 Q 115 -70 95 -90" />
        </g>
      </g>
    </g>

    <!-- 1st Place Gold Medal (Hanging from top edge) -->
    <g transform="translate(20, 15)">
      <!-- Ribbon -->
      <path d="M -5 -5 L 25 30 L 15 40 L -15 5 Z" fill="#E23636" stroke="#111" stroke-width="2" />
      <path d="M 45 -5 L 25 30 L 15 40 L 55 5 Z" fill="#0047BB" stroke="#111" stroke-width="2" />
      <circle cx="20" cy="40" r="22" fill="#FFC107" stroke="#111" stroke-width="3" />
      <circle cx="20" cy="40" r="16" fill="#FFEB3B" stroke="#D4AF37" stroke-width="2" />
      <text x="20" y="48" font-family="'Arial Black', Impact, sans-serif" font-size="22" font-weight="900" fill="#111" text-anchor="middle">#1</text>
      <path d="M 8 28 L 11 30 L 9 33 Z" fill="#FFF" />
    </g>
    
    <!-- Issue Details Removed for cleaner look -->

    <!-- 3D Title Section -->
    <g transform="translate(160, 105)">
      <text x="0" y="-30" class="title-small" text-anchor="middle">THE AMAZING</text>
      <text x="0" y="12" class="title-large title-shadow" text-anchor="middle" transform="skewX(-15)">DEVELOPER</text>
      <text x="2" y="10" class="title-large title-3d" text-anchor="middle" transform="skewX(-15)">DEVELOPER</text>
      <text x="4" y="8" class="title-large title-3d" text-anchor="middle" transform="skewX(-15)">DEVELOPER</text>
      <text x="6" y="6" class="title-large title-3d" text-anchor="middle" transform="skewX(-15)">DEVELOPER</text>
      <text x="8" y="4" class="title-large title-front" text-anchor="middle" transform="skewX(-15)">DEVELOPER</text>
    </g>

    <!-- Giant Spider-Man Head (Floating) -->
    <g transform="translate(150, 260)">
      <g class="breathe">
        <!-- Head Base -->
        <ellipse cx="0" cy="0" rx="65" ry="85" fill="url(#red-suit)" stroke="#111" stroke-width="4" />
        
        <!-- Head Web Pattern -->
        <g stroke="#111" stroke-width="2.5" opacity="0.8">
          <!-- Radial Webs -->
          <path d="M 0 -85 L 0 85" />
          <path d="M -65 0 L 65 0" />
          <path d="M -46 -60 L 46 60" />
          <path d="M 46 -60 L -46 60" />
          <path d="M -25 -78 L 25 78" />
          <path d="M 25 -78 L -25 78" />
          <path d="M -60 -25 L 60 25" />
          <path d="M 60 -25 L -60 25" />
  
          <!-- Circular Webs -->
          <ellipse cx="0" cy="0" rx="18" ry="24" fill="none" />
          <ellipse cx="0" cy="0" rx="36" ry="48" fill="none" />
          <ellipse cx="0" cy="0" rx="52" ry="68" fill="none" />
        </g>
        
        <!-- Aggressive But Curved Eyes -->
        <g transform="translate(0, -10)">
          <!-- Left Eye Background -->
          <path d="M -4 12 Q -25 -20 -45 -40 Q -60 -25 -62 -10 Q -40 35 -15 25 Q -10 18 -4 12 Z" fill="#111" stroke="#111" stroke-width="4" stroke-linejoin="round" />
          <!-- Left Eye Inner -->
          <path d="M -9 11 Q -28 -15 -42 -32 Q -53 -20 -55 -10 Q -38 25 -18 19 Q -13 15 -9 11 Z" fill="#FFF" />
          
          <!-- Right Eye Background -->
          <path d="M 4 12 Q 25 -20 45 -40 Q 60 -25 62 -10 Q 40 35 15 25 Q 10 18 4 12 Z" fill="#111" stroke="#111" stroke-width="4" stroke-linejoin="round" />
          <!-- Right Eye Inner -->
          <path d="M 9 11 Q 28 -15 42 -32 Q 53 -20 55 -10 Q 38 25 18 19 Q 13 15 9 11 Z" fill="#FFF" />
        </g>
      </g>
    </g>

    <!-- Action Burst Box (Bottom Left) -->
    <g transform="translate(60, 310) rotate(-10)">
      <path d="M 2 -48 L 22 -23 L 52 -18 L 37 12 L 57 42 L 27 32 L 2 62 L -23 32 L -53 42 L -33 12 L -48 -18 L -18 -23 Z" fill="#111" />
      <path d="M 0 -50 L 20 -25 L 50 -20 L 35 10 L 55 40 L 25 30 L 0 60 L -25 30 L -55 40 L -35 10 L -50 -20 L -20 -25 Z" fill="#FFEB3B" stroke="#E23636" stroke-width="3" />
      <text x="0" y="-12" class="burst" text-anchor="middle">SPIDER-</text>
      <text x="0" y="5" class="burst" text-anchor="middle" font-size="20px">SENSE</text>
      <text x="0" y="25" class="burst" text-anchor="middle">TINGLING!</text>
    </g>

    <!-- Barcode -->
    <g transform="translate(200, 335)">
      <rect x="0" y="0" width="85" height="50" fill="#FFF" stroke="#111" stroke-width="2" />
      <rect x="0" y="0" width="85" height="15" fill="#111" />
      <text x="42" y="11" font-family="Arial Black" font-size="9px" fill="#FFF" text-anchor="middle">DIRECT EDITION</text>
      <rect x="5" y="18" width="3" height="20" fill="#111" />
      <rect x="10" y="18" width="1" height="20" fill="#111" />
      <rect x="13" y="18" width="4" height="20" fill="#111" />
      <rect x="19" y="18" width="2" height="20" fill="#111" />
      <rect x="23" y="18" width="6" height="20" fill="#111" />
      <rect x="31" y="18" width="2" height="20" fill="#111" />
      <rect x="35" y="18" width="8" height="20" fill="#111" />
      <rect x="45" y="18" width="1" height="20" fill="#111" />
      <rect x="48" y="18" width="5" height="20" fill="#111" />
      <rect x="55" y="18" width="3" height="20" fill="#111" />
      <rect x="60" y="18" width="2" height="20" fill="#111" />
      <rect x="65" y="18" width="5" height="20" fill="#111" />
      <rect x="73" y="18" width="2" height="20" fill="#111" />
      <rect x="77" y="18" width="3" height="20" fill="#111" />
      <text x="42" y="46" font-family="Courier, monospace" font-size="8px" fill="#111" text-anchor="middle">59382 74830</text>
    </g>
  </g>
</svg>