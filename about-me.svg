<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="100%">
  <defs>
    <!-- Comic Halftone Pattern -->
    <pattern id="halftone" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="3" cy="3" r="2" fill="#E23636" opacity="0.15" />
    </pattern>
    <style>
      .comic-title { font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', Impact, sans-serif; font-size: 44px; font-weight: 900; fill: #FFFFFF; text-transform: uppercase; letter-spacing: 1px; }
      .comic-title-shadow-cyan { font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', Impact, sans-serif; font-size: 44px; font-weight: 900; fill: #00FFFF; text-transform: uppercase; letter-spacing: 1px; animation: glitch-anim-1 2s infinite linear alternate-reverse; mix-blend-mode: screen; }
      .comic-title-shadow-red { font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', Impact, sans-serif; font-size: 44px; font-weight: 900; fill: #E23636; text-transform: uppercase; letter-spacing: 1px; animation: glitch-anim-2 3s infinite linear alternate-reverse; mix-blend-mode: screen; }
      
      .body-text { font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif; font-size: 16px; font-weight: 700; fill: #000000; line-height: 1.4; }
      
      .subtitle { font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', Impact, sans-serif; font-size: 26px; font-weight: 800; fill: #FFFFFF; text-transform: uppercase; letter-spacing: 2px; }
      .pill-text { font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif; font-size: 13px; font-weight: 700; fill: #FFFFFF; text-transform: uppercase; letter-spacing: 1px; }
      
      .panel-border { stroke: #FFFFFF; stroke-width: 4; stroke-linejoin: round; fill: url(#halftone); }
      .box-border { stroke: #000000; stroke-width: 4; stroke-linejoin: miter; fill: #FFEB3B; }
      
      .pill-red { stroke: #000000; stroke-width: 3; stroke-linejoin: miter; fill: #E23636; }
      .pill-blue { stroke: #000000; stroke-width: 3; stroke-linejoin: miter; fill: #0047BB; }
      
      .web-line { stroke: #FFFFFF; stroke-width: 2; opacity: 0.15; stroke-linecap: round; }
      .spidey-eye { fill: none; stroke: #FFFFFF; stroke-width: 10; opacity: 0.08; stroke-linecap: round; stroke-linejoin: round; }
      
      .hover-scale { transition: transform 0.2s ease; transform-origin: center; cursor: default; }
      .pill-group:hover .hover-scale { transform: scale(1.05); }
      .pill-group:hover .pill-red { fill: #FF4B4B; }
      .pill-group:hover .pill-blue { fill: #00BFFF; }
    </style>
    <style>
      @keyframes glitch-anim-1 {
        0% { transform: translate(0, 0); opacity: 1; }
        10% { transform: translate(-3px, 2px); opacity: 0.8; }
        20% { transform: translate(4px, -1px); opacity: 1; }
        30% { transform: translate(-1px, 4px); opacity: 0.9; }
        40% { transform: translate(2px, -3px); opacity: 1; }
        50% { transform: translate(-4px, 1px); opacity: 0.7; }
        52% { transform: translate(15px, -5px); opacity: 1; }
        54% { transform: translate(-4px, 1px); opacity: 0.7; }
        60% { transform: translate(3px, 3px); opacity: 1; }
        70% { transform: translate(-2px, -2px); opacity: 0.8; }
        80% { transform: translate(1px, 4px); opacity: 1; }
        90% { transform: translate(-3px, -1px); opacity: 0.9; }
        100% { transform: translate(0, 0); opacity: 1; }
      }
      
      @keyframes glitch-anim-2 {
        0% { transform: translate(0, 0); opacity: 1; }
        10% { transform: translate(3px, -2px); opacity: 0.9; }
        20% { transform: translate(-4px, 1px); opacity: 0.8; }
        30% { transform: translate(1px, -4px); opacity: 1; }
        40% { transform: translate(-2px, 3px); opacity: 0.9; }
        50% { transform: translate(4px, -1px); opacity: 1; }
        60% { transform: translate(-3px, -3px); opacity: 0.8; }
        65% { transform: translate(-15px, 5px); opacity: 1; }
        68% { transform: translate(-3px, -3px); opacity: 0.8; }
        70% { transform: translate(2px, 2px); opacity: 1; }
        80% { transform: translate(-1px, -4px); opacity: 0.9; }
        90% { transform: translate(3px, 1px); opacity: 1; }
        100% { transform: translate(0, 0); opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect x="10" y="10" width="580" height="500" rx="14" fill="#050505" stroke="#222" stroke-width="2" />
  
  <!-- Main Comic Panel Background (Jagged) -->
  <polygon points="18,18 572,25 582,492 12,482" class="panel-border" />
  
  <!-- Giant Web Detail in Background -->
  <g transform="translate(300, 260)">
    <!-- Web radiating -->
    <path d="M 0 0 L -300 -260 M 0 0 L 0 -260 M 0 0 L 300 -260 M 0 0 L -300 0 M 0 0 L 300 0 M 0 0 L -300 260 M 0 0 L 0 260 M 0 0 L 300 260" class="web-line" />
    <path d="M -80 -80 Q 0 -50 80 -80 Q 50 0 80 80 Q 0 50 -80 80 Q -50 0 -80 -80 Z" class="web-line" fill="none" />
    <path d="M -160 -160 Q 0 -110 160 -160 Q 110 0 160 160 Q 0 110 -160 160 Q -110 0 -160 -160 Z" class="web-line" fill="none" />
    <path d="M -240 -240 Q 0 -170 240 -240 Q 170 0 240 240 Q 0 170 -240 240 Q -170 0 -240 -240 Z" class="web-line" fill="none" />
  </g>

  <!-- Giant Spidey Eye Outline (Subtle) -->
  <path d="M 180 150 Q 380 30 520 230 Q 330 280 180 150 Z" class="spidey-eye" />
  
  <!-- Title with Spider-Verse Glitch Effect -->
  <g transform="translate(50, 100) rotate(-2)">
    <!-- Glitch Shadows -->
    <text x="4" y="4" class="comic-title-shadow-cyan">HEY, SUCHIR HERE.</text>
    <text x="-4" y="-4" class="comic-title-shadow-red">HEY, SUCHIR HERE.</text>
    <!-- Main Text -->
    <text x="0" y="0" class="comic-title">HEY, SUCHIR HERE.</text>
  </g>
  
  <!-- Body Paragraph inside a Narrator Box -->
  <g transform="translate(45, 145) rotate(-1)">
    <!-- Drop Shadow -->
    <polygon points="5,5 495,0 485,115 -5,120" fill="#E23636" opacity="0.6" />
    <!-- Yellow Narrator Box -->
    <polygon points="0,0 490,-5 480,110 -10,115" class="box-border" />
    <text x="15" y="25" class="body-text">
      <tspan x="15" dy="0">I build high-impact software from the ground up.</tspan>
      <tspan x="15" dy="26">Obsessed with performance and design, I specialize in</tspan>
      <tspan x="15" dy="26">architecting scalable full-stack systems and crafting</tspan>
      <tspan x="15" dy="26">intuitive digital experiences that solve real problems.</tspan>
    </text>
  </g>

  <!-- Interests Section -->
  <g transform="translate(50, 320)">
    <!-- Header background block -->
    <rect x="-10" y="-30" width="180" height="38" fill="#000000" transform="skewX(-15)" />
    <text x="0" y="-2" class="subtitle">CORE FOCUS</text>
    
    <!-- Professional Pills as Comic Panels -->
    
    <!-- Pill 1: Full-Stack Architecture -->
    <g transform="translate(0, 35)" class="pill-group">
      <polygon points="0,0 255,-5 250,35 -5,40" class="pill-red hover-scale" />
      <text x="15" y="23" class="pill-text hover-scale">FULL-STACK ARCHITECTURE</text>
    </g>
    
    <!-- Pill 2: Startup Engineering -->
    <g transform="translate(270, 30)" class="pill-group">
      <polygon points="0,0 220,-5 225,35 5,40" class="pill-blue hover-scale" />
      <text x="15" y="22" class="pill-text hover-scale">STARTUP ENGINEERING</text>
    </g>

    <!-- Pill 3: Interface Design -->
    <g transform="translate(0, 95)" class="pill-group">
      <polygon points="-5,-5 200,0 195,40 0,35" class="pill-blue hover-scale" />
      <text x="15" y="22" class="pill-text hover-scale">INTERFACE DESIGN</text>
    </g>
    
    <!-- Pill 4: System Scaling -->
    <g transform="translate(215, 90)" class="pill-group">
      <polygon points="0,-5 180,0 185,40 -5,35" class="pill-red hover-scale" />
      <text x="15" y="22" class="pill-text hover-scale">SYSTEM SCALING</text>
    </g>
  </g>
</svg>