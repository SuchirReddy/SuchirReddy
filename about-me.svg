<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="100%">
    <!-- Titanium Gradient for Name -->
    <linearGradient id="titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#A0A0A0" />
      <stop offset="60%" stop-color="#E0E0E0" />
      <stop offset="100%" stop-color="#666666" />
    </linearGradient>

    <!-- Dot Grid Pattern -->
    <pattern id="dot-grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#444444" opacity="0.5" />
    </pattern>

    <!-- Vignette Fade Gradient -->
    <linearGradient id="fade-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050505" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#050505" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#050505" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0.85" />
    </linearGradient>

    <!-- Noise Filter -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
    </filter>

    <style>
      /* Clean, stark minimalist typography */
      .title { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 42px; font-weight: 800; fill: url(#titanium); letter-spacing: -1px; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 500; fill: #888888; letter-spacing: -0.2px; }
      .body-text { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 400; fill: #A0A0A0; line-height: 1.6; }
      .highlight { fill: #EAEAEA; font-weight: 600; }
      .pill-text { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #CCCCCC; }
      .pill-bg { fill: rgba(15,15,15,0.7); stroke: #333333; stroke-width: 1; }
    </style>
  </defs>

  <!-- Minimalist Black Card Base -->
  <rect x="10" y="10" width="580" height="500" rx="14" fill="#050505" stroke="#222222" stroke-width="1.5" />
  
  <!-- Architectural Dot Grid -->
  <rect x="11" y="11" width="578" height="498" rx="13" fill="url(#dot-grid)" />
  
  <!-- Subtle Gradient Overlay (Vignette effect to fade grid near text) -->
  <rect x="11" y="11" width="578" height="498" rx="13" fill="url(#fade-grad)" />
  
  <!-- Matte Noise Texture -->
  <rect x="10" y="10" width="580" height="500" rx="14" filter="url(#noise)" opacity="0.04" />
  
  <g transform="translate(50, 65)">
    <!-- Title -->
    <text x="0" y="40" class="title">Suchir Reddy.</text>
    
    <!-- Subtitle -->
    <text x="0" y="80" class="subtitle">Builder &amp; Founder</text>
    
    <!-- Body Paragraph -->
    <text x="0" y="140" class="body-text">
      <tspan x="0" dy="0">I build high-impact software from the ground up.</tspan>
      <tspan x="0" dy="38">Obsessed with performance and design, I specialize in</tspan>
      <tspan x="0" dy="32">architecting scalable full-stack systems and crafting</tspan>
      <tspan x="0" dy="32">intuitive digital experiences that solve real problems.</tspan>
    </text>

    <!-- Interests Section -->
    <text x="0" y="290" class="subtitle">Core Focus</text>
    
    <!-- Professional Pills with Status Dots -->
    <!-- Pill 1 -->
    <g transform="translate(0, 315)">
      <rect x="0" y="0" width="210" height="34" rx="6" class="pill-bg" />
      <!-- Glowing Blue Dot -->
      <circle cx="16" cy="17" r="4" fill="#00BFFF" />
      <text x="32" y="22" class="pill-text">Full-Stack Architecture</text>
    </g>
    
    <!-- Pill 2 -->
    <g transform="translate(230, 315)">
      <rect x="0" y="0" width="180" height="34" rx="6" class="pill-bg" />
      <!-- Glowing Blue Dot -->
      <circle cx="16" cy="17" r="4" fill="#00BFFF" />
      <text x="32" y="22" class="pill-text">Startup Engineering</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(0, 365)">
      <rect x="0" y="0" width="160" height="34" rx="6" class="pill-bg" />
      <!-- Glowing Blue Dot -->
      <circle cx="16" cy="17" r="4" fill="#00BFFF" />
      <text x="32" y="22" class="pill-text">Interface Design</text>
    </g>
    
    <!-- Pill 4 -->
    <g transform="translate(180, 365)">
      <rect x="0" y="0" width="150" height="34" rx="6" class="pill-bg" />
      <!-- Glowing Blue Dot -->
      <circle cx="16" cy="17" r="4" fill="#00BFFF" />
      <text x="32" y="22" class="pill-text">System Scaling</text>
    </g>
  </g>
</svg>
