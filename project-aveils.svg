<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 110" width="100%" height="110">
  <defs>
    <!-- Comic Halftone Pattern -->
    <pattern id="halftone" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="2" cy="2" r="1.2" fill="#E23636" opacity="0.15" />
    </pattern>
    <style>
      .comic-title { font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', Impact, sans-serif; font-size: 18px; font-weight: 800; fill: #FFFFFF; text-transform: uppercase; letter-spacing: 1px; transition: fill 0.3s ease, transform 0.2s ease; transform-origin: center; }
      .comic-label { font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif; font-size: 10px; font-weight: 700; fill: #FFFFFF; letter-spacing: 2px; }
      .panel-bg { fill: #111111; }
      .panel-border { stroke: #FFFFFF; stroke-width: 3; stroke-linejoin: miter; transition: stroke 0.3s ease; fill: url(#halftone); }
      .web-line { stroke: #FFFFFF; stroke-width: 1.5; opacity: 0.25; stroke-linecap: round; }
      svg:hover .panel-border { stroke: #E10600; stroke-width: 4; }
      svg:hover .comic-title { fill: #E10600; transform: scale(1.05); }
      svg:hover .bg-shadow { fill: #E10600; transform: translate(2px, 2px); transition: transform 0.2s ease, fill 0.3s ease; }
    </style>
  </defs>

  <!-- Shadow/Drop Effect (Classic Comic Style) -->
  <polygon points="12,12 238,8 232,108 6,102" fill="#E23636" opacity="0.8" class="bg-shadow" />
  
  <!-- Main Panel -->
  <polygon points="8,8 234,4 228,104 2,98" class="panel-bg" />
  <polygon points="8,8 234,4 228,104 2,98" class="panel-border" />
  
  <!-- Corner Web Detail -->
  <g transform="translate(8, 8)">
    <!-- Radiating lines -->
    <path d="M 0 0 L 0 35 M 0 0 L 35 0 M 0 0 L 25 25 M 0 0 L 10 32 M 0 0 L 32 10" class="web-line" fill="none" />
    <!-- Web connecting curves -->
    <path d="M 0 15 Q 8 12 11 11 Q 12 8 15 0" class="web-line" fill="none" />
    <path d="M 0 25 Q 12 20 18 18 Q 20 12 25 0" class="web-line" fill="none" />
    <path d="M 0 35 Q 18 28 25 25 Q 28 18 35 0" class="web-line" fill="none" />
  </g>

  <!-- Text Content -->
  <g transform="rotate(-1.5 120 55)">
    <rect x="15" y="15" width="115" height="18" fill="#E23636" transform="skewX(-15)" />
    <text x="25" y="27" class="comic-label">GROWTH OS</text>
    <text x="120" y="65" text-anchor="middle" class="comic-title">aveils.in</text>
  </g>
</svg>