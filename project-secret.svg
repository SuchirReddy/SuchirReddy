<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="100%">
  <defs>
    <style>
      .web-line { stroke: #FFFFFF; stroke-width: 1.5; fill: none; opacity: 0.15; stroke-linecap: round; }
      .title { font-family: 'Arial Black', Impact, sans-serif; font-size: 26px; font-weight: 900; fill: #FFFFFF; text-anchor: middle; letter-spacing: 2px; }
      .title-shadow { font-family: 'Arial Black', Impact, sans-serif; font-size: 26px; font-weight: 900; fill: #000000; text-anchor: middle; letter-spacing: 2px; stroke: #000000; stroke-width: 10; stroke-linejoin: round; }
      .title-glow { font-family: 'Arial Black', Impact, sans-serif; font-size: 26px; font-weight: 900; fill: none; stroke: #E23636; stroke-width: 16; stroke-linejoin: round; opacity: 0.8; text-anchor: middle; letter-spacing: 2px; }
      
      .spin { animation: spin 80s linear infinite; transform-origin: 450px 60px; }
      @keyframes spin { 100% { transform: rotate(360deg); } }
      
      .pulse { animation: pulse 2s ease-in-out infinite alternate; }
      @keyframes pulse { 100% { opacity: 1; transform: scale(1.02); } }
      
      .bounce { animation: bounce 0.6s cubic-bezier(0.5, 0, 0.5, 1) infinite alternate; }
      @keyframes bounce { 
        0% { transform: translateY(5px); }
        100% { transform: translateY(-15px); }
      }
    </style>
  </defs>



  <!-- Title Text with Heavy Comic Drop Shadow and Glow -->
  <g transform="translate(0, 0)" class="pulse" style="transform-origin: 450px 60px; opacity: 0.9;">
    <!-- Red Glow -->
    <text x="450" y="70" class="title-glow">TOP SECRET: MY PRIVATE COMMITS GO HERE</text>
    <!-- Heavy Black Stroke (Outline) -->
    <text x="450" y="70" class="title-shadow">TOP SECRET: MY PRIVATE COMMITS GO HERE</text>
    <!-- White/Red Text Layer -->
    <text x="450" y="70" class="title"><tspan fill="#E23636">TOP SECRET:</tspan> MY PRIVATE COMMITS GO HERE</text>
  </g>

  <!-- Right Bouncing Up Arrow -->
  <g transform="translate(870, 60)">
    <g class="bounce">
      <!-- Glow -->
      <path d="M 0 -25 L 20 0 L 8 0 L 8 20 L -8 20 L -8 0 L -20 0 Z" fill="none" stroke="#FFEB3B" stroke-width="12" stroke-linejoin="round" opacity="0.5" />
      <!-- Arrow -->
      <path d="M 0 -25 L 20 0 L 8 0 L 8 20 L -8 20 L -8 0 L -20 0 Z" fill="#FFEB3B" stroke="#000" stroke-width="4" stroke-linejoin="round" />
    </g>
  </g>
</svg>