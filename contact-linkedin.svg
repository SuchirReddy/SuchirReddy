<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 120" width="100%" height="120">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; font-size: 13px; font-weight: 600; fill: #FFA500; text-transform: uppercase; letter-spacing: 2px; }
      .link { font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; font-size: 16px; font-weight: 700; fill: #FFFFFF; transition: fill 0.3s ease, transform 0.2s ease; transform-origin: center; }
      svg:hover .link { fill: #FFA500; transform: scale(1.05); }
      .portal-spark { animation: spin 4s linear infinite; transform-origin: 45px 60px; }
      @keyframes spin { 100% { transform: rotate(360deg); } }
      .spark { stroke: #FF9800; fill: none; stroke-linecap: round; opacity: 0.8; }
      svg:hover .spark { stroke: #FFC107; filter: drop-shadow(0 0 4px #FF9800); }
    </style>
  </defs>
  
  <rect x="5" y="5" width="240" height="110" rx="12" fill="#0D1117" stroke="#333" stroke-width="1.5" />
  
  <!-- Portal -->
  <g class="portal-spark">
    <circle cx="45" cy="60" r="32" stroke="#FF5722" stroke-width="3" fill="none" stroke-dasharray="5 5" />
    <circle cx="45" cy="60" r="35" stroke="#FF9800" stroke-width="2" fill="none" stroke-dasharray="2 6" />
    <circle cx="45" cy="60" r="38" stroke="#FFC107" stroke-width="1" fill="none" stroke-dasharray="8 4" />
    
    <path d="M 13 60 L 5 60 M 77 60 L 85 60 M 45 28 L 45 20 M 45 92 L 45 100" class="spark" stroke-width="2" />
    <path d="M 23 38 L 17 32 M 67 82 L 73 88 M 67 38 L 73 32 M 23 82 L 17 88" class="spark" stroke-width="1.5" />
  </g>

  <!-- Text -->
  <g transform="translate(100, 55)">
    <text x="0" y="-5" class="title">LINKEDIN</text>
    <text x="0" y="22" class="link">/in/suchirreddy</text>
  </g>
</svg>