<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 60" width="100%" height="60">
  <defs>
    <!-- Frame Gradient -->
    <linearGradient id="frame-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>

    <!-- Glass Overlay -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .sys-font { font-family: "JetBrains Mono", "Fira Code", "Courier New", monospace; font-size: 14px; font-weight: 600; fill: #888888; letter-spacing: 2px; }
      .header-font { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 18px; font-weight: 700; fill: #FFFFFF; letter-spacing: 1px; text-transform: uppercase; }
      .doodle-font { font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", cursive, sans-serif; font-size: 18px; font-weight: 700; fill: #FFFFFF; letter-spacing: 1px; text-transform: uppercase; }
      .blink { animation: blinker 2s linear infinite; }
      @keyframes blinker {
        50% { opacity: 0; }
      }
    </style>
  </defs>


  <!-- Doodle Spiderman Face -->
  <g transform="translate(15, 10)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Round Head -->
    <circle cx="25" cy="20" r="18" fill="#e23636" stroke="#000" stroke-width="2" />
    
    <!-- Web lines -->
    <path d="M 25 2 C 22 15, 22 25, 25 38 M 15 5 C 15 15, 15 25, 15 35 M 35 5 C 35 15, 35 25, 35 35" stroke="#7a0000" stroke-width="1" opacity="0.6" />
    <path d="M 8 13 C 15 17, 35 17, 42 13 M 7 21 C 15 25, 35 25, 43 21 M 11 29 C 18 32, 32 32, 39 29" stroke="#7a0000" stroke-width="1" opacity="0.6" />
    
    <!-- Sharp Doodle Eyes -->
    <path d="M 8 16 Q 16 6 23 18 Q 15 19 8 16 Z" fill="#fff" stroke="#000" stroke-width="2" stroke-linejoin="miter" />
    <path d="M 42 16 Q 34 6 27 18 Q 35 19 42 16 Z" fill="#fff" stroke="#000" stroke-width="2" stroke-linejoin="miter" />
  </g>
  
  <!-- Doodle Speech Bubble -->
  <path d="M 75 13 Q 150 10 190 12 Q 215 13 218 25 Q 223 38 200 46 Q 150 49 100 46 Q 75 45 72 38 L 52 28 L 71 25 Q 70 15 75 13 Z" fill="#1E1E1E" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" />
  <text x="85" y="34" class="doodle-font">My Stats</text>
  
</svg>
