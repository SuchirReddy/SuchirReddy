<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 120" width="100%" height="120">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; font-size: 13px; font-weight: 600; fill: #00FFFF; text-transform: uppercase; letter-spacing: 2px; }
      .link { font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; font-size: 12px; font-weight: 700; fill: #FFFFFF; transition: fill 0.3s ease, transform 0.2s ease; transform-origin: center; }
      svg:hover .link { fill: #00FFFF; transform: scale(1.05); }
      .core { transition: all 0.3s ease; }
      svg:hover .core { fill: #FFFFFF; filter: drop-shadow(0 0 8px #00FFFF); }
    </style>
  </defs>
  
  <rect x="5" y="5" width="240" height="110" rx="12" fill="#0D1117" stroke="#333" stroke-width="1.5" />
  
  <!-- Arc Reactor -->
  <g transform="translate(45, 60)">
    <circle cx="0" cy="0" r="38" fill="#222" stroke="#444" stroke-width="2" />
    <circle cx="0" cy="0" r="33" fill="none" stroke="#00FFFF" stroke-width="1" opacity="0.5" />
    
    <!-- Coils -->
    <path d="M -33 -10 L -28 0 L -33 10 M 33 -10 L 28 0 L 33 10 M -10 -33 L 0 -28 L 10 -33 M -10 33 L 0 28 L 10 33" stroke="#00FFFF" stroke-width="2" fill="none" />
    
    <!-- Inner Rings -->
    <circle cx="0" cy="0" r="23" fill="none" stroke="#444" stroke-width="3" />
    <circle cx="0" cy="0" r="18" fill="none" stroke="#00FFFF" stroke-width="2" stroke-dasharray="4 4" />
    
    <!-- Core -->
    <circle cx="0" cy="0" r="9" fill="#00FFFF" class="core" />
    <path d="M 0 -9 L 0 -14 M 0 9 L 0 14 M -9 0 L -14 0 M 9 0 L 14 0" stroke="#00FFFF" stroke-width="1" class="core" />
  </g>

  <!-- Text -->
  <g transform="translate(100, 55)">
    <text x="0" y="-5" class="title">EMAIL</text>
    <text x="0" y="22" class="link">workforsuchir@gmail.com</text>
  </g>
</svg>