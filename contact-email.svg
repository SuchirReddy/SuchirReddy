<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 120" width="100%" height="120">
  <defs>
    <linearGradient id="frame-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>
    <pattern id="dot-grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#444444" opacity="0.5" />
    </pattern>
    <linearGradient id="fade-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050505" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#050505" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#050505" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0.85" />
    </linearGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
    </filter>
    <style>
      .label-font { font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; font-size: 11px; font-weight: 600; fill: #777777; text-transform: uppercase; letter-spacing: 1px; }
      .data-font { font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; font-size: 14px; font-weight: 700; fill: #FFFFFF; }
    </style>
  </defs>

  <rect x="5" y="5" width="240" height="110" rx="12" fill="url(#frame-grad)" stroke="#333" stroke-width="1.5" />
  <rect x="7" y="7" width="236" height="106" rx="10" fill="url(#dot-grid)" />
  <rect x="7" y="7" width="236" height="106" rx="10" fill="url(#fade-grad)" />
  <rect x="7" y="7" width="236" height="106" rx="10" fill="url(#glass)" />
  <rect x="5" y="5" width="240" height="110" rx="12" filter="url(#noise)" opacity="0.04" />
  
  <g transform="translate(125, 55)">
    <text x="0" y="-5" text-anchor="middle" class="label-font">Direct Comms</text>
    <text x="0" y="22" text-anchor="middle" class="data-font">workforsuchir@gmail.com</text>
    <rect x="-15" y="38" width="30" height="3" fill="#00BFFF" />
  </g>
</svg>
