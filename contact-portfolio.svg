<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 120" width="100%" height="120">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; font-size: 13px; font-weight: 600; fill: #FF4B4B; text-transform: uppercase; letter-spacing: 2px; }
      .link { font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; font-size: 16px; font-weight: 700; fill: #FFFFFF; transition: fill 0.3s ease, transform 0.2s ease; transform-origin: center; }
      svg:hover .link { fill: #FF4B4B; transform: scale(1.05); }
      .shield { transition: transform 0.3s ease; transform-origin: center; }
      svg:hover .shield { transform: rotate(15deg) scale(1.1); }
    </style>
    <radialGradient id="metal" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3" />
    </radialGradient>
  </defs>
  
  <rect x="5" y="5" width="240" height="110" rx="12" fill="#0D1117" stroke="#333" stroke-width="1.5" />
  
  <!-- Shield -->
  <g transform="translate(45, 60)" class="shield">
    <circle cx="0" cy="0" r="35" fill="#E23636" />
    <circle cx="0" cy="0" r="26" fill="#EEEEEE" />
    <circle cx="0" cy="0" r="18" fill="#E23636" />
    <circle cx="0" cy="0" r="9" fill="#0047BB" />
    <polygon points="0,-7 2,-3 7,-3 3,1 4,6 0,3 -4,6 -3,1 -7,-3 -2,-3" fill="#EEEEEE" />
    <circle cx="0" cy="0" r="35" fill="url(#metal)" />
  </g>

  <!-- Text -->
  <g transform="translate(100, 55)">
    <text x="0" y="-5" class="title">PORTFOLIO</text>
    <text x="0" y="22" class="link">suchir.aveils.in</text>
  </g>
</svg>