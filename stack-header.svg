<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 60" width="100%" height="60">
  <defs>
    <!-- Frame Gradient -->
    <linearGradient id="frame-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>

    <!-- Glass Overlay -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .sys-font { font-family: "JetBrains Mono", "Fira Code", "Courier New", monospace; font-size: 14px; font-weight: 600; fill: #888888; letter-spacing: 2px; }
      .header-font { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 18px; font-weight: 700; fill: #FFFFFF; letter-spacing: 1px; text-transform: uppercase; }
      .blink { animation: blinker 2s linear infinite; }
      @keyframes blinker {
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Outer Monitor Frame -->
  <rect x="5" y="5" width="990" height="50" rx="8" fill="url(#frame-grad)" stroke="#333" stroke-width="1.5" />
  
  <!-- Glass Reflection -->
  <rect x="7" y="7" width="986" height="46" rx="6" fill="url(#glass)" />

  <text x="30" y="36" class="header-font">Tech Stack</text>
  
  <!-- Blinking Status Dot (Blue for tech systems) -->
  <circle cx="960" cy="30" r="5" fill="#00BFFF" filter="url(#glow)" class="blink" />
  <text x="880" y="35" class="sys-font" fill="#00BFFF">ACTIVE</text>
  
  <!-- Decorative Separator Line -->
  <path d="M 860 15 L 860 45" stroke="#333" stroke-width="1.5" />
</svg>
