<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="300">
  <defs>
    <style>
      .truss { 
        fill: #222; 
        stroke: #000; 
        stroke-width: 10; 
      }
      .truss-inner {
        fill: none;
        stroke: #444;
        stroke-width: 2;
      }
      
      .red-light {
        fill: #FF3333;
      }
      .off-light {
        fill: #111;
        stroke: #000;
        stroke-width: 4;
      }
      
      .tech {
        opacity: 0;
        animation: tech-reveal 8s infinite;
      }
      
      .col1-anim { animation: light1 8s infinite; opacity: 0; }
      .col2-anim { animation: light2 8s infinite; opacity: 0; }
      .col3-anim { animation: light3 8s infinite; opacity: 0; }
      .col4-anim { animation: light4 8s infinite; opacity: 0; }
      .col5-anim { animation: light5 8s infinite; opacity: 0; }

      @keyframes light1 {
        0%, 12.4% { opacity: 0; }
        12.5%, 74.9% { opacity: 1; }
        75%, 100% { opacity: 0; }
      }
      @keyframes light2 {
        0%, 24.9% { opacity: 0; }
        25%, 74.9% { opacity: 1; }
        75%, 100% { opacity: 0; }
      }
      @keyframes light3 {
        0%, 37.4% { opacity: 0; }
        37.5%, 74.9% { opacity: 1; }
        75%, 100% { opacity: 0; }
      }
      @keyframes light4 {
        0%, 49.9% { opacity: 0; }
        50%, 74.9% { opacity: 1; }
        75%, 100% { opacity: 0; }
      }
      @keyframes light5 {
        0%, 62.4% { opacity: 0; }
        62.5%, 74.9% { opacity: 1; }
        75%, 100% { opacity: 0; }
      }
      @keyframes tech-reveal {
        0%, 74.9% { opacity: 0; }
        75%, 98% { opacity: 1; }
        100% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- 3D Solid Board -->
  <!-- Outer thick black border and shadow -->
  <rect x="50" y="50" width="800" height="200" class="truss" rx="15" />
  <!-- Inner light highlight for 3D bevel effect -->
  <rect x="55" y="55" width="790" height="190" class="truss-inner" rx="10" />

  <!-- Base dark circles for all 10 slots -->
  <circle cx="130" cy="100" r="32" class="off-light" />
  <circle cx="290" cy="100" r="32" class="off-light" />
  <circle cx="450" cy="100" r="32" class="off-light" />
  <circle cx="610" cy="100" r="32" class="off-light" />
  <circle cx="770" cy="100" r="32" class="off-light" />
  <circle cx="130" cy="200" r="32" class="off-light" />
  <circle cx="290" cy="200" r="32" class="off-light" />
  <circle cx="450" cy="200" r="32" class="off-light" />
  <circle cx="610" cy="200" r="32" class="off-light" />
  <circle cx="770" cy="200" r="32" class="off-light" />

