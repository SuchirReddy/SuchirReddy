<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="200">
  <defs>
    <!-- 3D Gradients for the Car -->
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050817" />
      <stop offset="25%" stop-color="#1A2863" />
      <stop offset="60%" stop-color="#0A102E" />
      <stop offset="90%" stop-color="#030510" />
    </linearGradient>

    <linearGradient id="red-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF334B" />
      <stop offset="50%" stop-color="#E2001A" />
      <stop offset="100%" stop-color="#66000B" />
    </linearGradient>

    <linearGradient id="yellow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFDF66" />
      <stop offset="50%" stop-color="#FFC220" />
      <stop offset="100%" stop-color="#A67B00" />
    </linearGradient>

    <radialGradient id="tire-grad" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#111" />
      <stop offset="95%" stop-color="#222" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>

    <radialGradient id="rim-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#999" />
      <stop offset="60%" stop-color="#555" />
      <stop offset="100%" stop-color="#111" />
    </radialGradient>

    <linearGradient id="halo-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#444" />
      <stop offset="50%" stop-color="#111" />
      <stop offset="100%" stop-color="#000" />
    </linearGradient>

    <!-- Metallic Helmet -->
    <radialGradient id="helmet-metallic" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF" />
      <stop offset="40%" stop-color="#888" />
      <stop offset="100%" stop-color="#222" />
    </radialGradient>

    <style>
      .car { animation: drive 12s cubic-bezier(0.4, 0.0, 0.2, 1) infinite; }
      .wheel { animation: spin 0.8s linear infinite; transform-origin: 0 0; }
      
      @keyframes drive {
        0% { transform: translateX(-300px); }
        100% { transform: translateX(1200px); }
      }
      @keyframes spin {
        100% { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- Pit lane ground line with gradient shadow -->
  <rect x="0" y="150" width="1000" height="10" fill="rgba(0,0,0,0.3)" />
  <line x1="0" y1="150" x2="1000" y2="150" stroke="#444" stroke-width="4" />
  
  <g class="car">
    <!-- Drop Shadow under car -->
    <ellipse cx="125" cy="150" rx="130" ry="8" fill="#000" opacity="0.4" />

    <!-- REAR WING (3D Plates) -->
    <!-- Inner endplate -->
    <path d="M15,80 L25,80 L25,120 L15,120 Z" fill="#030510" />
    <!-- Wing elements -->
    <rect x="25" y="75" width="25" height="6" fill="url(#red-grad)" rx="2" />
    <rect x="25" y="85" width="30" height="4" fill="url(#yellow-grad)" rx="1" />
    <rect x="25" y="95" width="30" height="4" fill="url(#body-grad)" rx="1" />
    <!-- Outer endplate -->
    <path d="M10,75 L20,75 L20,125 L10,125 Z" fill="url(#body-grad)" />
    
    <!-- ENGINE COVER & COCKPIT -->
    <path d="M 30 110 L 45 80 Q 75 75 90 90 L 110 110 Z" fill="url(#body-grad)" />
    <!-- Intake shadow (depth) -->
    <path d="M 40 85 L 50 75 L 55 85 Z" fill="#000" />
    
    <!-- DRIVER HELMET (Metallic 3D) -->
    <!-- Driver sits back in cockpit -->
    <circle cx="102" cy="85" r="10" fill="url(#helmet-metallic)" />
    <!-- Visor -->
    <path d="M98,80 C110,80 112,85 110,90 L98,85 Z" fill="#000" />
    <path d="M100,81 C105,81 108,83 108,85 L100,83 Z" fill="#FFF" opacity="0.4" />
    
    <!-- CHASSIS (Smooth Curves) -->
    <path d="M 15 110 L 150 110 Q 180 115 210 120 L 210 135 L 15 135 Z" fill="url(#body-grad)" />
    <path d="M 150 110 Q 180 115 210 120 L 210 125 Q 180 120 150 115 Z" fill="#FFF" opacity="0.1" /> <!-- Highlight -->
    
    <!-- NOSE & FRONT WING -->
    <path d="M 210 120 L 255 128 L 255 135 L 210 135 Z" fill="url(#yellow-grad)" />
    <path d="M 235 125 L 265 129 L 265 134 L 235 130 Z" fill="url(#red-grad)" />
    <!-- Wing endplate -->
    <path d="M 265 124 L 270 124 L 270 138 L 265 136 Z" fill="url(#body-grad)" />
    
    <!-- HALO (Thick 3D tube) -->
    <!-- We simulate a tube by using a stroke and overlaying a thinner stroke for highlight -->
    <path d="M 85 90 C 100 75 115 85 130 115" fill="none" stroke="#222" stroke-width="5" stroke-linecap="round" />
    <path d="M 85 90 C 100 75 115 85 130 115" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
    
    <!-- SIDEPODS (Curved 3D volume) -->
    <path d="M 60 108 C 80 90 130 95 140 120 Z" fill="url(#red-grad)" />
    <path d="M 80 110 C 100 100 125 105 125 120 Z" fill="url(#yellow-grad)" />
    
    <!-- REAR WHEEL (3D Cylinder) -->
    <g transform="translate(55, 122)">
      <!-- 3D Tire Tread Thickness (Darker inner edge) -->
      <path d="M-5,-24 A24,24 0 1,1 -5,24 L0,24 A24,24 0 1,0 0,-24 Z" fill="#000" />
      <circle cx="0" cy="0" r="24" fill="url(#tire-grad)" />
      
      <g class="wheel">
        <circle cx="0" cy="0" r="15" fill="url(#rim-grad)" />
        <circle cx="0" cy="0" r="11" fill="#111" />
        <circle cx="0" cy="0" r="4.5" fill="url(#red-grad)" /> <!-- Red Rim Ring -->
        <!-- 3D Metallic Spokes -->
        <line x1="0" y1="-15" x2="0" y2="15" stroke="#999" stroke-width="2" />
        <line x1="-15" y1="0" x2="15" y2="0" stroke="#999" stroke-width="2" />
        <line x1="-10" y1="-10" x2="10" y2="10" stroke="#777" stroke-width="2" />
        <line x1="-10" y1="10" x2="10" y2="-10" stroke="#777" stroke-width="2" />
      </g>
    </g>

    <!-- FRONT WHEEL (3D Cylinder) -->
    <g transform="translate(200, 122)">
      <path d="M-5,-24 A24,24 0 1,1 -5,24 L0,24 A24,24 0 1,0 0,-24 Z" fill="#000" />
      <circle cx="0" cy="0" r="24" fill="url(#tire-grad)" />
      <g class="wheel">
        <circle cx="0" cy="0" r="15" fill="url(#rim-grad)" />
        <circle cx="0" cy="0" r="11" fill="#111" />
        <circle cx="0" cy="0" r="4.5" fill="url(#yellow-grad)" /> <!-- Yellow Rim Ring -->
        <line x1="0" y1="-15" x2="0" y2="15" stroke="#999" stroke-width="2" />
        <line x1="-15" y1="0" x2="15" y2="0" stroke="#999" stroke-width="2" />
        <line x1="-10" y1="-10" x2="10" y2="10" stroke="#777" stroke-width="2" />
        <line x1="-10" y1="10" x2="10" y2="-10" stroke="#777" stroke-width="2" />
      </g>
    </g>
  </g>

  <!-- Aerodynamic Speed Lines -->
  <line x1="50" y1="160" x2="250" y2="160" stroke="url(#red-grad)" stroke-width="3" opacity="0.6">
    <animate attributeName="x1" values="1000; -300" dur="1.7s" repeatCount="indefinite" />
    <animate attributeName="x2" values="1200; -100" dur="1.7s" repeatCount="indefinite" />
  </line>
  <line x1="300" y1="175" x2="600" y2="175" stroke="url(#yellow-grad)" stroke-width="3" opacity="0.6">
    <animate attributeName="x1" values="1200; -200" dur="1.9s" repeatCount="indefinite" />
    <animate attributeName="x2" values="1500; 100" dur="1.9s" repeatCount="indefinite" />
  </line>
  <line x1="100" y1="152" x2="300" y2="152" stroke="#FFF" stroke-width="2" opacity="0.4">
    <animate attributeName="x1" values="1100; -400" dur="1.8s" repeatCount="indefinite" />
    <animate attributeName="x2" values="1300; -200" dur="1.8s" repeatCount="indefinite" />
  </line>
</svg>
